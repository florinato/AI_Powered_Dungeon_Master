world_id: "roma_republicana"
world_name: "Las Sombras de Roma"
language: "Español"
historical_context: "República Romana Tardía, alrededor del 60 a.C. durante el Primer Triunvirato de César, Pompeyo y Craso. Una época de inmensa riqueza, ambición política y conspiraciones."

world_theme: "Thriller político y de espionaje con elementos de la vida cotidiana romana. Piensa en la serie 'Roma' de HBO mezclada con una novela de John le Carré."
world_description: |
  Roma no es solo mármol y gloria; es una bestia que se alimenta de secretos. Mientras los senadores debaten en el Foro, en las oscuras tabernas de la Subura se tejen traiciones que derribarán a hombres poderosos. Las legiones conquistan el mundo, pero la verdadera batalla por el alma de la República se libra en susurros, con dagas ocultas bajo las togas y veneno en las copas de vino.

