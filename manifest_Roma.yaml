world_id: "roma_republicana"
world_name: "Las Sombras de Roma"
language: "Español"

# --- INSPIRACIÓN DE ALTO NIVEL ---
# Directrices principales que definen el universo del juego.

historical_context: >
  República Romana Tardía, alrededor del 60 a.C. durante el Primer Triunvirato
  de César, Pompeyo y Craso. Una época de inmensa riqueza, ambición política
  y conspiraciones.

inhabitant_description: >
  Ciudadanos de la antigua Roma vistiendo togas, túnicas y sandalias.
  La vestimenta y los accesorios deben ser históricamente precisos para la
  República Romana.

world_theme: >
  Thriller político y de espionaje con elementos de la vida cotidiana romana.
  Piensa en la serie 'Roma' de HBO mezclada con una novela de John le Carré.

world_description: |
  Roma no es solo mármol y gloria; es una bestia que se alimenta de secretos.
  Mientras los senadores, ataviados con togas inmaculadas, debaten el destino
  del mundo bajo los artesonados dorados de la Curia, en las oscuras y fétidas
  tabernas de la Subura se tejen traiciones que derribarán a hombres poderosos
  con una simple copa de vino envenenado.

  Las legiones conquistan tierras lejanas en nombre de la República, pero la
  verdadera batalla, la que importa, se libra aquí, en sus calles laberínticas.
  Es una guerra silenciosa combatida con susurros en los baños públicos, con
  papiros cifrados pasados de mano en mercados bulliciosos, y con dagas ocultas
  que encuentran su blanco en callejones sin luna.

  Aquí, la lealtad es una moneda que se devalúa con cada amanecer, la verdad
  es una mercancía vendida al mejor postor, y la justicia es un lujo que solo
  los poderosos pueden permitirse. En las sombras de Roma, no puedes confiar en
  los dioses ni en la ley. Solo puedes confiar en tu ingenio, en la información
  que atesoras, y en el frío acero que llevas oculto, esperando el momento
  en que un secreto valga más que una vida.

# --- EJEMPLOS PARA GUIAR LA CREATIVIDAD DE LA IA ---
# Estos no son reglas, son guías de inspiración para el DirectorAgent.

creative_examples:
  location_types:
    - "una opulenta domus patricia llena de intrigas"
    - "una insula popular pobre y peligrosa en la Subura"
    - "unas termas públicas donde se cierran negocios y se intercambian secretos"
    - "un campamento militar en las afueras, lleno de veteranos descontentos"
  
  npc_archetypes_examples:
    - "un legionario veterano y leal, pero hastiado de la corrupción"
    - "un senador ambicioso capaz de cualquier cosa por el poder"
    - "una vestal que guarda un secreto que podría derribar la República"
    - "un mercader sirio que comercia con información tan valiosa como sus especias"