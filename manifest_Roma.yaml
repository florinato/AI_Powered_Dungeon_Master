quest_seeds:
- title: "La Daga del Senador"
  description: "Un senador influyente ha sido asesinado. El principal sospechoso es un legionario leal, pero las pruebas no encajan. Hay una conspiración detrás."
  quest_giver_archetype: "legionario veterano leal"
  boss_archetype: "senador ambicioso y sin escrúpulos"
  key_item_idea: "Una daga ceremonial con un emblema secreto que no pertenece a la víctima."

- title: "El Veneno de las Vestales"
  description: "Una de las sacerdotisas del Templo de Vesta ha caído gravemente enferma por un veneno exótico. Se sospecha de una intriga interna para silenciarla."
  quest_giver_archetype: "vestal que conoce un secreto divino"
  boss_archetype: "mercader sirio con conexiones en el hampa" # Quizás él vendió el veneno
  key_item_idea: "Un frasco de antídoto raro que debe ser encontrado o fabricado."

- title: "El Papiro Perdido"
  description: "Un esclavo erudito ha robado un papiro con información comprometedora sobre la malversación de fondos en la construcción de un acueducto. Ahora está desaparecido."
  quest_giver_archetype: "esclavo griego con información valiosa" # Un amigo del desaparecido
  boss_archetype: "senador ambicioso y sin escrúpulos"
  key_item_idea: "El papiro robado, que está dividido en varios fragmentos."