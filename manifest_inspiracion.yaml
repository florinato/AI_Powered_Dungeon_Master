language: "Español"

# La idea principal que quieres explorar.
initial_briefing: >
  La Venganza de los Silicoides
  El universo de FATE que te propongo se centra en las secuelas de una guerra interestelar. Las grandes potencias galácticas han quedado diezmadas. Los grandes imperios cayeron, las flotas se dispersaron y la tecnología ha retrocedido. La anarquía reina en los sectores más alejados, mientras los pocos gobiernos que quedan intentan aferrarse a su menguante poder.

  En este contexto de caos, el gran antagonista no es una facción política, sino una forma de vida artificial. Los silicoides, una raza de criaturas con base de silicio y tecnología avanzada, fueron los responsables de la caída de los grandes imperios. Su objetivo: purgar la vida basada en el carbono y reclamar la galaxia para sí mismos. Durante siglos estuvieron dormidos, o eso se creía.

  Los jugadores son miembros de una de las últimas grandes naves estelares supervivientes, la Esperanza, una enorme nave de exploración y colonización de última generación que, por fortuna, quedó aislada del conflicto en una misión de exploración a una nebulosa distante. A su regreso, descubren el estado de la galaxia y la amenaza de los silicoides.

  Tono y Jugabilidad
  El tono del juego se asemeja a una mezcla de la intriga política de Dune y la exploración y cooperación de Star Trek. La tripulación de la Esperanza no solo tendrá que lidiar con los silicoides, sino también con otras facciones supervivientes, cada una con sus propios intereses y secretos.

  Dune: La tripulación de la Esperanza tendrá que enfrentarse a una política complicada. Para sobrevivir, deberán forjar alianzas, negociar recursos y desentrañar conspiraciones. Puede haber poderosas casas comerciales, sectas religiosas misteriosas que predican el fin del mundo y gobiernos autoritarios que intentan restaurar el antiguo orden. Las intrigas y la política serán una parte importante del juego.

  Star Trek: La tripulación tendrá que explorar el universo, descubrir nuevas formas de vida (algunas amistosas, otras no tanto), reparar tecnología obsoleta y mejorar la nave, descubrir secretos de la guerra y, por supuesto, evitar el enfrentamiento directo con los silicoides. La cooperación, la diplomacia y la resolución de problemas serán tan importantes como el combate.

  Ejemplos de Aspectos y Puntos de Trama
  Aspectos de la nave: La última esperanza de la humanidad, Tecnología obsoleta pero resistente, Una tripulación leal pero muy reducida.

  Aspectos de los personajes: El último de los ingenieros genéticos, Piloto experimentado de un mundo olvidado, Diplomático experto en el arte de la mentira.

  Puntos de trama: Hay que encontrar la cura para una plaga misteriosa que afecta a las últimas colonias humanas, Un artefacto silicide olvidado promete poder, pero también destrucción, La tripulación se encuentra con otra nave superviviente que tiene motivos sospechosos.

  La idea es que los jugadores no solo se dediquen a combatir, sino a reconstruir la sociedad galáctica, mientras los silicoides acechan en las sombras, esperando el momento de atacar. Es un escenario perfecto para FATE, ya que los Aspectos de los jugadores y la tripulación tendrán un gran peso en cómo se desarrolla la historia.